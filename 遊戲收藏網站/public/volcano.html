*{box-sizing:border-box}body{margin:0;background:#140b1a;color:#ffe5ab;font-family:system-ui,-apple-system,sans-serif}.game{max-width:500px;margin:auto;padding:10px;background:radial-gradient(ellipse at top,#71301e,#190d22 75%);min-height:100dvh;border-inline:2px solid #c18a38}h1{text-align:center;margin:6px 0 12px;font-size:30px;color:#ffdc83;text-shadow:0 2px 8px #fb661b}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats>div{text-align:center;background:#37162a;border:2px solid #d6a14b;border-radius:9px;padding:8px}.stats small{display:block;color:#dcb98a}.stats b{font-size:20px}.reels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;padding:5px;background:#5d2b21;border:4px ridge #e6ac48;border-radius:12px;margin-top:12px}.tile{aspect-ratio:1;min-width:0;overflow:hidden;border:1px solid transparent;border-radius:4px;background:transparent}.tile img{width:100%;height:100%;object-fit:contain}.tile.hit{opacity:.35;transform:scale(.9)}.tile.boom{box-shadow:0 0 14px #ff7b0a;border:2px solid #ffde72}.msg{text-align:center;min-height:47px;padding:14px 0 4px;font-weight:800}.win{text-align:center;color:#ffe45c;font-size:22px;font-weight:900;min-height:30px}.meterrow{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin:13px 0 5px}.track{height:21px;border-radius:15px;border:1px solid #e6a748;background:#2b1423;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#bb2918,#ff841d,#ffec68);width:0;transition:width .2s}.bet{display:flex;align-items:center;gap:10px;margin:15px 0 9px}.bet label{white-space:nowrap;font-size:14px}.bet input{min-width:0;flex:1;width:100%;font-size:21px;text-align:center;background:#261329;color:#ffe7b4;border:2px solid #e4ad56;border-radius:9px;padding:10px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}button{touch-action:manipulation;cursor:pointer;font-family:inherit}.quick button{padding:10px 0;background:#4d253c;color:#ffe7b1;border:1px solid #b98244;border-radius:8px}.spin{width:100%;padding:17px 5px;margin-top:12px;border:3px solid #ffda80;border-radius:14px;background:linear-gradient(#e44c86,#80217d);color:#fff0bb;font-size:25px;font-weight:950}.spin:disabled{opacity:.5}.refill{width:100%;margin-top:8px;background:#48263c;color:white;border:1px solid #b78348;border-radius:8px;padding:9px}.bonus{text-align:center;margin-top:9px;background:#652a5d;border:1px solid #ffdb80;padding:9px;border-radius:9px;font-weight:800}.note{font-size:11px;text-align:center;color:#d5ae93;margin:13px 0;line-height:1.7}
 .reelwrap{position:relative;overflow:hidden;border-radius:12px}.fall-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}.fall-ball{position:absolute;top:-65px;width:55px;height:55px;display:grid;place-items:center;border:4px solid #ffdd73;border-radius:50%;background:radial-gradient(circle at 30% 20%,#fff4c0,#f2a719 45%,#9c380a);box-shadow:0 0 18px #ffad32;color:#702409;font-size:21px;font-weight:1000;animation:fallDown .9s cubic-bezier(.25,.75,.25,1) forwards}.fall-ball.purple{border-color:#e6b5ff;background:radial-gradient(circle at 30% 20%,#fff2ff,#ad44e8 50%,#4d0b7e);color:white;box-shadow:0 0 18px #bb55ff}@keyframes fallDown{0%{top:-65px;transform:rotate(-30deg) scale(.75);opacity:0}25%{opacity:1}75%{top:55%;transform:rotate(25deg) scale(1.15)}100%{top:73%;transform:rotate(0) scale(1);opacity:0}} .tile img{object-fit:contain!important;display:block;width:100%;height:100%}  .autoctrl select{flex:1;min-width:0;border:2px solid #dba552;background:#2b1729;color:#ffebbd;font-size:17px;border-radius:8px;padding:10px} .autoctrl{display:flex;gap:7px;align-items:center;margin-top:10px}.autoctrl label{font-size:13px;white-space:nowrap}.autoctrl input{width:76px;min-width:0;flex:1;border:2px solid #dba552;background:#2b1729;color:#ffebbd;font-size:18px;border-radius:8px;padding:11px;text-align:center}.autoctrl button{flex:1;min-width:0;border:2px solid #dba552;background:#65315d;color:#fff0c2;border-radius:9px;padding:11px 4px;font-size:14px;font-weight:800}.autoctrl button:disabled{opacity:.45}
.split-balls{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:min-content;align-content:center;justify-items:center;gap:6px;padding:8px}
.split-balls .fall-ball{position:relative;top:auto;width:min(10vw,50px);height:min(10vw,50px);border-width:2px;font-size:clamp(11px,3.1vw,18px);animation:splitOut .45s ease-out both}
@keyframes splitOut{from{transform:translate(var(--split-x),var(--split-y)) scale(.65)}to{transform:translate(0,0) scale(1)}}
@media(prefers-reduced-motion:reduce){.split-balls .fall-ball{animation:none}}

function rollBallSplit(values, wasFree, random=Math.random){
 if(random()>=(wasFree?.10:.30))return null;
 const index=Math.floor(random()*values.length);
 const roll=random();
 // Conditional split weights for 2, 3, 4, 5, 8, and 10 balls.
 const count=[2,3,4,5,8,10][[.50,.75,.88,.95,.99,1].findIndex(limit=>roll<limit)];

function makeBall(value){
 const ball=document.createElement('div');
 ball.className='fall-ball'+(value>=20?' purple':'');
 ball.textContent='×'+value;
 return ball;
}
async function dropBalls(values,split,total){
 const layer=$('fall-layer');layer.innerHTML='';
 const balls=values.map((v,i)=>{
  const ball=makeBall(v);
  // Spread simultaneous balls evenly so they do not overlap on a phone.
  ball.style.left=((i+1)*100/(values.length+1))+'%';
  ball.style.transform='translateX(-50%)';
  ball.style.animationDuration=(timing(900)/1000)+'s';
  layer.appendChild(ball);
  return ball;
 });
 if(split){
  await wait(timing(675));
  const origin=balls[split.index].getBoundingClientRect();
  const burst=document.createElement('div');
  burst.className='split-balls';
  for(let i=0;i<split.count;i++)burst.appendChild(makeBall(split.value));
  layer.replaceChildren(burst);
  // Disable the animation while measuring each ball's destination.
  for(const ball of burst.children)ball.style.animation='none';
  const destinations=Array.from(burst.children,ball=>ball.getBoundingClientRect());
  Array.from(burst.children).forEach((ball,i)=>{
   const end=destinations[i];
   ball.style.setProperty('--split-x',(origin.left+origin.width/2-end.left-end.width/2)+'px');
   ball.style.setProperty('--split-y',(origin.top+origin.height/2-end.top-end.height/2)+'px');
   ball.style.animation='';
  });
  $('msg').textContent='✨ 倍率球分身！×'+split.value+' 分成 '+split.count+' 顆｜本轉球合計 ×'+total;
  await wait(timing(2125));
 }else{
  await wait(timing(1100));await wait(timing(1700));
 }

}

 const before=free;free=Math.min(30,free+extra);balance+=won;if(wasFree)freeWinnings+=won;
 if(extra)$('msg').textContent='🌋 免費遊戲 +'+(free-before)+(free-before<extra?'（30次上限）':'');
 else if(chains)$('msg').textContent='✨ '+chains+'次連鎖消除';
 else $('msg').textContent='';
 if(full&&volcano)$('msg').textContent='🌋 雙重爆發！免費遊戲最多30次';
 if(full){await wait(timing(1400));heat=0;}
 $('win').textContent=won?'贏得 '+fmt(won)+' 籌碼':'';
 // Hold important outcomes on screen before any automatic follow-up spin.
 if(won>0)await wait(timing(1200));
 if(extra>0)await wait(timing(1600));
 if(wasFree&&free===0&&freeSession){$('msg').textContent='🎉 免費遊戲結束｜累積彩金 '+fmt(freeWinnings);freeSession=false;}
 busy=false;ui();sync.save({board,balance,free,bet,freeBet,heat,multi,freeWinnings,freeSession});return true;
}
async function playFreeSpins(){
 if(freeLoop||busy||free<=0)return;
 freeLoop=true;ui();
 try{
   while(free>0){
     const ok=await spin();if(!ok)break;
     await wait(timing(500));
   }
 }finally{freeLoop=false;ui()}
}
async function runAuto(){
 if(autoRunning||busy||freeLoop||free>0)return;
 let count=Math.floor(Number($('auto-count').value));
 if(!Number.isFinite(count)||count<1)count=1;
 count=Math.min(10000,count);$('auto-count').value=count;
 readBet();autoRunning=true;autoStop=false;autoRemaining=count;ui();
 try{
   while(autoRemaining>0&&!autoStop){
     const ok=await spin();if(!ok)break;
     if(free>0)await playFreeSpins();
     autoRemaining--;ui();if(autoStop)break;
     await wait(timing(500));
   }
 }finally{
   autoRunning=false;autoStop=false;autoRemaining=0;$('auto-stop').textContent='■ 停止';ui();
 }
}
$('auto-start').addEventListener('click',runAuto);
$('auto-stop').addEventListener('click',()=>{autoStop=true;$('auto-stop').disabled=true;$('auto-stop').textContent='停止中…'});
$('spin').addEventListener('click',async()=>{if(busy||freeLoop||autoRunning)return;const ok=await spin();if(ok&&free>0)await playFreeSpins()});
const restored=sync.state;
if(restored){
 ({board,balance,free,bet,freeBet,heat,multi,freeWinnings,freeSession}=restored);
 $('bet').value=bet;
}else board=newBoard(.008);
draw();ui();
if(free>0)await playFreeSpins();

})();
</script></body></html>
